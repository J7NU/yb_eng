name: 갤러리 빌드

# /admin 에서 글을 저장하면 CMS 가 content/posts 와 images/posts 에 커밋한다.
# 그 커밋을 받아 갤러리 페이지를 다시 만들고 홈 8칸 타일 링크·잠금 상태를 갱신한다.
#
# 루프가 안 도는 이유: CMS 커밋은 진우의 OAuth 토큰이라 이 워크플로를 트리거하지만,
# 이 워크플로가 GITHUB_TOKEN 으로 만든 커밋은 다시 워크플로를 트리거하지 않는다 (GitHub 기본 동작).

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'images/posts/**'
      - 'images/thumb/**'
      - 'index.html'
      - 'tools/build-gallery.mjs'
      - 'tools/categories.mjs'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # shallow 로 받으면 아래 rebase 가 merge base 를 못 찾는다
          fetch-depth: 0
          # 이벤트 SHA 가 아니라 브랜치 끝을 받는다.
          # 글을 연달아 저장하면 2번째 런이 1번째 런이 이미 밀어넣은 갤러리 커밋을 못 본 채
          # 같은 파일을 통째로 다시 써서 rebase 충돌로 죽는다 (그 글은 영영 발행 안 됨)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 이미지 도구 설치·확인
        # 설치가 실패해도 발행 자체는 막지 않는다 — 사장님이 올린 글이 안 나가는 게 더 큰 손해다.
        # 대신 경고 주석을 남겨 조용한 열화가 되지 않게 한다
        continue-on-error: true
        run: |
          # GitHub 러너에는 magick/convert/ffmpeg 가 셋 다 없다 (실제 잡 로그로 확인).
          # 없으면 폰 원본 수 MB 가 그대로 레포에 쌓이고 방문자에게도 그대로 나간다.
          if ! command -v magick && ! command -v convert && ! command -v ffmpeg; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
          fi
          if ! command -v magick && ! command -v convert && ! command -v ffmpeg; then
            echo "::warning::이미지 축소 도구 설치 실패 — 원본이 그대로 서빙된다. 이 실행 뒤 사진 용량을 확인할 것"
          fi

      - name: 갤러리 생성
        run: node tools/build-gallery.mjs

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery images index.html sitemap.xml
          git commit -m 'chore(gallery): 시공사례 반영 (자동)'
          # 체크아웃과 푸시 사이에 다른 런이나 사람이 main 을 밀 수 있다.
          # 생성물은 언제나 다시 만들 수 있으므로, 충돌하면 최신 main 위에서 다시 빌드해 재시도한다
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 실패 — 최신 main 위에서 다시 빌드해 재시도 ($i/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node tools/build-gallery.mjs
            if [ -z "$(git status --porcelain)" ]; then
              echo "재빌드 결과 변경 없음 — 다른 런이 이미 반영했다"
              exit 0
            fi
            git add gallery images index.html sitemap.xml
            git commit -m 'chore(gallery): 시공사례 반영 (자동)'
          done
          echo "::error::3회 재시도 후에도 푸시 실패 — 수동 확인 필요"
          exit 1
